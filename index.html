<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Schloss Eggenberg · Druckrechner</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0a0a0a; --card:#141414; --card2:#1d1d1d; --line:#2e2e2e;
    --text:#f3efe7; --muted:#8f8a80; --gold:#c9a24b; --gold2:#e0bd6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Georgia,"Times New Roman",serif;
    background:radial-gradient(120% 60% at 50% 0%,#191919,#0a0a0a 70%);
    color:var(--text);min-height:100vh;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 30px);
  }
  .wrap{max-width:480px;margin:0 auto}
  header{text-align:center;padding:30px 0 6px}
  header img.logo{width:min(74%,300px);height:auto;filter:invert(1);display:block;margin:0 auto}
  .rule{width:54px;height:2px;background:var(--gold);margin:18px auto 4px;opacity:.8}
  .tagline{text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:8px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 18px;margin-top:18px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
  .field .unit{color:var(--gold);font-weight:bold;font-style:italic}
  input[type=number]{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:13px 14px;font-size:1.1rem;font-family:Georgia,serif;outline:none;
  }
  input[type=number]:focus{border-color:var(--gold)}
  .toggle{display:flex;gap:10px}
  .toggle button{
    flex:1;background:var(--card2);border:1px solid var(--line);color:var(--muted);
    padding:13px;border-radius:10px;font-size:1.05rem;font-family:Georgia,serif;cursor:pointer;
  }
  .toggle button.active{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:bold}
  .result{
    margin-top:22px;text-align:center;background:linear-gradient(180deg,#1c1813,#141210);
    border:1px solid #3a2f1c;border-radius:16px;padding:22px 14px;
  }
  .result .lbl{color:var(--muted);font-size:.8rem;letter-spacing:3px;text-transform:uppercase}
  .result .val{font-size:3.2rem;font-weight:bold;color:var(--gold2);line-height:1.1;margin-top:6px}
  .result .val span{font-size:1.2rem;color:var(--muted);font-style:italic}
  .sub{margin-top:14px;color:var(--muted);font-size:.92rem}
  .sub b{color:var(--text);font-weight:normal}
  .reset{display:block;margin:22px auto 0;background:none;border:1px solid var(--line);
    color:var(--muted);padding:10px 18px;border-radius:10px;cursor:pointer;font-family:Georgia,serif}
  footer{text-align:center;color:var(--muted);opacity:.5;font-size:.72rem;margin-top:26px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Schloss Eggenberg">
    <div class="rule"></div>
    <div class="tagline">Druckrechner · Schankanlage</div>
  </header>

  <div class="card">
    <div class="field">
      <label>Temperatur <span class="unit">°C</span></label>
      <input type="number" inputmode="decimal" step="0.1" id="temp" placeholder="z. B. 10">
    </div>
    <div class="field">
      <label>Höhenmeter <span class="unit">m</span></label>
      <input type="number" inputmode="decimal" step="0.1" id="hoehe" placeholder="z. B. 1">
    </div>
    <div class="field">
      <label>Leitungslänge <span class="unit">m</span></label>
      <input type="number" inputmode="decimal" step="0.1" id="laenge" placeholder="z. B. 10">
    </div>
    <div class="field">
      <label>Kühlschlange nutzen?</label>
      <div class="toggle">
        <button id="kja">ja</button>
        <button id="knein" class="active">nein</button>
      </div>
    </div>
  </div>

  <div class="result">
    <div class="lbl">Betriebsdruck</div>
    <div class="val" id="betrieb">0,52 <span>bar</span></div>
    <div class="sub">Sättigungsdruck: <b id="sat">0,52 bar</b></div>
  </div>

  <button class="reset" onclick="resetAll()">Zurücksetzen</button>
  <footer>Schloss Eggenberg</footer>
</div>

<script>
const DEF = {temp:'', hoehe:'', laenge:'', kuehl:false};
function load(){ try{ return {...DEF, ...(JSON.parse(localStorage.getItem('brau1')||'{}'))}; }catch(e){ return {...DEF}; } }
function save(){ localStorage.setItem('brau1', JSON.stringify(state)); }
let state = load();

// Formel (wie Blatt "berechnung_fertig" in der Excel)
function calc(){
  const T = parseFloat(state.temp)||0, H = parseFloat(state.hoehe)||0, L = parseFloat(state.laenge)||0;
  const kuehl = state.kuehl ? 14 : 0;
  const sat = 0.52 + 0.07 * T;
  const betrieb = sat + 0.1*H + 0.05*(L + kuehl);
  return {sat, betrieb};
}
function fmt(x){ return x.toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2}); }

function update(){
  const r = calc();
  document.getElementById('betrieb').innerHTML = fmt(r.betrieb) + ' <span>bar</span>';
  document.getElementById('sat').textContent = fmt(r.sat) + ' bar';
  document.getElementById('kja').classList.toggle('active', state.kuehl);
  document.getElementById('knein').classList.toggle('active', !state.kuehl);
  save();
}

function fill(){
  document.getElementById('temp').value = state.temp;
  document.getElementById('hoehe').value = state.hoehe;
  document.getElementById('laenge').value = state.laenge;
  update();
}

['temp','hoehe','laenge'].forEach(id=>{
  document.getElementById(id).addEventListener('input', e=>{ state[id]=e.target.value; update(); });
});
document.getElementById('kja').addEventListener('click', ()=>{ state.kuehl=true; update(); });
document.getElementById('knein').addEventListener('click', ()=>{ state.kuehl=false; update(); });

function resetAll(){ state = {...DEF}; fill(); }

fill();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
